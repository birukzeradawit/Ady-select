<!DOCTYPE html>
<html>
<head>
<style>
body { background: #FAF7F4; margin: 0; padding: 20px; font-family: sans-serif; }
.cart-runner-track {
  width: 100%;
  overflow: hidden;
  position: relative;
  height: 80px;
  background: linear-gradient(90deg, rgba(247,239,235,0) 0%, rgba(247,239,235,0.8) 15%, rgba(247,239,235,0.8) 85%, rgba(247,239,235,0) 100%);
  border-bottom: 1px solid rgba(184, 106, 80, 0.2);
  display: flex;
  align-items: center;
}
.cart-runner {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: strollCart 16s linear infinite;
  white-space: nowrap;
}
@keyframes strollCart {
  0% { transform: translateX(-160px); }
  100% { transform: translateX(calc(100vw + 40px)); }
}
.cart-speech-bubble {
  background: #181615;
  color: #FAF7F4;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.cart-speech-bubble::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  border-width: 5px 0 5px 6px;
  border-style: solid;
  border-color: transparent transparent transparent #181615;
}
.wheel {
  transform-origin: center;
  animation: rotateWheel 1s linear infinite;
}
@keyframes rotateWheel {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.girl-body {
  animation: bobWalk 0.5s ease-in-out infinite alternate;
}
@keyframes bobWalk {
  from { transform: translateY(0px); }
  to { transform: translateY(-2px); }
}
</style>
</head>
<body>
<div class="cart-runner-track">
  <div class="cart-runner">
    <div class="cart-speech-bubble">Curating our USA &amp; Canada Drop ✨</div>
    <svg width="150" height="70" viewBox="0 0 150 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Girl -->
      <g class="girl-body">
        <!-- Head & Ponytail -->
        <circle cx="28" cy="16" r="7" fill="#181615" />
        <!-- Hair Ponytail flowing -->
        <path d="M24 14 C18 12, 14 18, 12 22 C14 20, 20 18, 24 17 Z" fill="#B86A50" />
        <circle cx="23" cy="14" r="2" fill="#C5A059" /> <!-- Hair tie -->
        <!-- Face profile -->
        <path d="M32 15 C33 16, 33 18, 31 19 C33 20, 31 22, 29 23" stroke="#181615" stroke-width="1.2" fill="none" />
        <!-- Neck & Body (Chic Trench / Outfit) -->
        <path d="M26 23 L23 48 L35 48 L31 23 Z" fill="#181615" />
        <!-- Belt / Accent -->
        <line x1="24" y1="36" x2="33" y2="36" stroke="#C5A059" stroke-width="2" />
        <!-- Legs -->
        <path d="M25 48 L22 64" stroke="#181615" stroke-width="2.5" stroke-linecap="round" />
        <path d="M31 48 L34 64" stroke="#181615" stroke-width="2.5" stroke-linecap="round" />
        <!-- Chic Shoes -->
        <path d="M22 64 L26 64" stroke="#B86A50" stroke-width="2.5" stroke-linecap="round" />
        <path d="M34 64 L38 64" stroke="#B86A50" stroke-width="2.5" stroke-linecap="round" />
        <!-- Arms pushing cart -->
        <path d="M28 26 L42 34 L54 36" stroke="#181615" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Shopping Cart Handle -->
      <path d="M52 32 L58 37" stroke="#8F4C35" stroke-width="3" stroke-linecap="round" />
      <path d="M58 37 L63 56" stroke="#B86A50" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cart Basket (Wireframe in Rose Gold) -->
      <path d="M60 38 L114 38 L104 55 L65 55 Z" fill="rgba(247,239,235,0.7)" stroke="#B86A50" stroke-width="1.8" />
      <!-- Grid lines -->
      <line x1="62" y1="43" x2="111" y2="43" stroke="#D98880" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="64" y1="49" x2="107" y2="49" stroke="#D98880" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="74" y1="38" x2="72" y2="55" stroke="#D98880" stroke-width="1" />
      <line x1="88" y1="38" x2="86" y2="55" stroke="#D98880" stroke-width="1" />
      <line x1="100" y1="38" x2="96" y2="55" stroke="#D98880" stroke-width="1" />

      <!-- Brand Plate LABELED "ADY" -->
      <rect x="73" y="42" width="28" height="11" rx="2.5" fill="#181615" stroke="#C5A059" stroke-width="1" />
      <text x="87" y="50" font-family="'Montserrat', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ADY</text>

      <!-- Cart Chassis & Wheels -->
      <path d="M65 55 L70 61 L100 61 L103 55" stroke="#8F4C35" stroke-width="2" fill="none" />
      
      <!-- Back Wheel -->
      <g transform="translate(72, 62)">
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#181615" stroke-width="1.5" />
        <g class="wheel">
          <line x1="-3" y1="0" x2="3" y2="0" stroke="#B86A50" stroke-width="1" />
          <line x1="0" y1="-3" x2="0" y2="3" stroke="#B86A50" stroke-width="1" />
        </g>
        <circle cx="0" cy="0" r="1.5" fill="#C5A059" />
      </g>

      <!-- Front Wheel -->
      <g transform="translate(98, 62)">
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#181615" stroke-width="1.5" />
        <g class="wheel">
          <line x1="-3" y1="0" x2="3" y2="0" stroke="#B86A50" stroke-width="1" />
          <line x1="0" y1="-3" x2="0" y2="3" stroke="#B86A50" stroke-width="1" />
        </g>
        <circle cx="0" cy="0" r="1.5" fill="#C5A059" />
      </g>

      <!-- Items inside the Cart (Overflowing Luxury Goodies!) -->
      <!-- 1. Luxury Sephora shopping bag -->
      <rect x="65" y="24" width="16" height="15" rx="1" fill="#FFFFFF" stroke="#181615" stroke-width="1.2" transform="rotate(-6 65 24)" />
      <path d="M70 24 C70 19, 76 19, 76 24" stroke="#B86A50" stroke-width="1.2" fill="none" />
      <!-- 2. Perfume bottle with gold cap -->
      <rect x="83" y="22" width="10" height="16" rx="1.5" fill="#F4E8E3" stroke="#C5A059" stroke-width="1.2" transform="rotate(8 83 22)" />
      <rect x="86" y="18" width="4" height="4" fill="#C5A059" />
      <line x1="88" y1="16" x2="88" y2="18" stroke="#8F4C35" stroke-width="1" />
      <!-- 3. Skincare Serum / Dropper -->
      <rect x="94" y="25" width="8" height="14" rx="1" fill="#B86A50" transform="rotate(15 94 25)" />
      <path d="M99 22 C99 20, 102 20, 102 22 Z" fill="#FFFFFF" />
      <!-- 4. Lipstick tube with gold band -->
      <rect x="76" y="29" width="6" height="12" rx="1" fill="#181615" transform="rotate(-15 76 29)" />
      <rect x="76.5" y="26" width="5" height="3" fill="#D98880" transform="rotate(-15 76.5 26)" />
      <!-- 5. Gift box with ribbon -->
      <rect x="100" y="30" width="12" height="10" rx="1" fill="#EED8CF" stroke="#B86A50" stroke-width="1" />
      <line x1="106" y1="30" x2="106" y2="40" stroke="#C5A059" stroke-width="1" />

      <!-- Sparkles / Stars behind -->
      <path d="M120 18 L121.5 22 L125.5 23.5 L121.5 25 L120 29 L118.5 25 L114.5 23.5 L118.5 22 Z" fill="#C5A059" opacity="0.85" />
      <path d="M136 28 L137 31 L140 32 L137 33 L136 36 L135 33 L132 32 L135 31 Z" fill="#B86A50" opacity="0.7" />
    </svg>
  </div>
</div>
</body>
</html>
